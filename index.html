<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シフト希望フォーム</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      color-scheme: light;
      --line: #06c755;
      --border: #d9dee5;
      --text: #202124;
      --muted: #5f6368;
      --bg: #f6f7f9;
      --sun: #c62828;
      --sat: #1565c0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 10px 8px 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.3;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .panel {
      padding: 10px;
      margin-bottom: 10px;
    }

    .status,
    .message,
    .small {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    label {
      display: block;
      margin-top: 8px;
      font-weight: 700;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      margin-top: 6px;
      border-radius: 6px;
      font-size: 16px;
    }

    input,
    select,
    textarea {
      border: 1px solid #c9cdd3;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
    }

    button {
      border: 0;
      padding: 10px 12px;
      background: var(--line);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      background: #aeb4ba;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: end;
    }

    .toolbar > label {
      flex: 1;
    }

    .calendar-shell {
      padding-bottom: 8px;
    }

    .weekday-row,
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday-row {
      margin-top: 8px;
      padding: 0 2px 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .weekday-row span:first-child {
      color: var(--sun);
    }

    .weekday-row span:last-child {
      color: var(--sat);
    }

    .month-grid {
      gap: 3px;
    }

    .calendar-day {
      min-width: 0;
      min-height: clamp(58px, calc((100dvh - 252px) / 6), 92px);
      border-radius: 6px;
    }

    .calendar-day {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      margin: 0;
      border: 1px solid #e2e6ec;
      padding: 5px 2px;
      background: #fff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .calendar-day.selected {
      border-color: var(--line);
      box-shadow: 0 0 0 2px rgba(6, 199, 85, 0.16);
    }

    .calendar-day.has-value {
      background: #f8fffb;
    }

    .calendar-day.outside-month {
      background: #f4f6f8;
      color: #6d7278;
    }

    .calendar-day.outside-month.has-value {
      background: #f0f8f3;
    }

    .calendar-day.outside-month .date-number {
      opacity: 0.72;
    }

    .calendar-day.invalid {
      border-color: #d93025;
      background: #fff7f6;
    }

    .calendar-day.locked {
      border-color: #dde1e7;
      background: #f1f3f4;
      color: #7b8087;
      cursor: not-allowed;
    }

    .calendar-day.locked.has-value {
      background: #eef1f3;
    }

    .date-number {
      display: block;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
    }

    .date-number.sun {
      color: var(--sun);
    }

    .date-number.sat {
      color: var(--sat);
    }

    .date-value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      overflow: hidden;
      margin-top: auto;
      border-radius: 999px;
      min-height: 18px;
      padding: 2px 1px;
      background: #eef1f5;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }

    .date-value.has-up {
      flex-direction: column;
      gap: 0;
      min-height: 27px;
      border-radius: 8px;
      overflow: visible;
      padding: 2px 1px;
    }

    .date-value-time {
      display: block;
      max-width: 100%;
      min-width: 0;
      overflow: visible;
      line-height: 1.05;
      text-align: center;
    }

    .date-value.long-time .date-value-time {
      font-size: 8px;
    }

    .date-value-up {
      display: inline-block;
      min-width: 0;
      border-radius: 999px;
      padding: 0 3px;
      background: rgba(6, 199, 85, 0.14);
      font-size: 7px;
      line-height: 1;
    }

    .date-value.work {
      background: #e8f5ee;
      color: #0b7f3b;
    }

    .date-value.off {
      background: #f2f3f5;
      color: #4f565f;
    }

    .date-value.invalid {
      background: #fce8e6;
      color: #c5221f;
    }

    .date-value.locked {
      background: #e1e5ea;
      color: #5f6368;
    }

    .date-lock {
      display: block;
      margin-top: 2px;
      color: #7b8087;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
    }

    .edit-panel {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      padding: 12px;
      background: rgba(32, 33, 36, 0.18);
    }

    .edit-sheet {
      max-width: 720px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
      padding: 14px;
      background: #fff;
      box-shadow: 0 -8px 26px rgba(60, 64, 67, 0.18);
    }

    .edit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .edit-title {
      font-size: 18px;
      font-weight: 800;
    }

    .close-button {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      background: #eef1f5;
      color: var(--text);
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .up-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-weight: 700;
    }

    .up-row input {
      width: 22px;
      height: 22px;
      margin: 0;
    }

    .value {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .success-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(32, 33, 36, 0.28);
    }

    .success-box {
      width: min(320px, 100%);
      border-radius: 10px;
      padding: 22px 18px 18px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(32, 33, 36, 0.22);
      text-align: center;
    }

    .success-title {
      margin: 0;
      color: var(--line);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
    }

    .success-text {
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .success-button {
      margin-top: 0;
      padding: 9px 12px;
    }

    @media (max-width: 420px) {
      main {
        padding: 8px 6px 24px;
      }

      h1 {
        margin-bottom: 6px;
        font-size: 20px;
      }

      .panel {
        padding: 8px;
        margin-bottom: 8px;
      }

      .status,
      .message,
      .small {
        font-size: 12px;
        line-height: 1.35;
      }

      label {
        margin-top: 6px;
      }

      input,
      select,
      textarea,
      button {
        font-size: 15px;
      }

      input,
      select,
      textarea {
        padding: 7px 8px;
      }

      .weekday-row {
        margin-top: 6px;
        padding-bottom: 3px;
      }

      .calendar-day {
        min-height: clamp(56px, calc((100dvh - 214px) / 6), 88px);
      }

      .date-number {
        font-size: 13px;
      }

      .date-value {
        min-height: 17px;
        font-size: 9px;
      }

      .date-value.has-up {
        min-height: 25px;
      }

      .date-value.long-time .date-value-time {
        font-size: 7.5px;
      }

      .date-value-up {
        font-size: 6.5px;
      }
    }

    .backend-frame {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>シフト希望フォーム</h1>

    <section id="authPanel" class="panel">
      <p id="status" class="status">LINE情報を確認中です...</p>

      <div id="registerPanel" class="hidden">
        <label for="storeName">初回登録名</label>
        <input id="storeName" type="text" autocomplete="name" placeholder="例: 北川">
        <p class="small">この名前は管理用です。後から管理者がスプレッドシートで変更できます。</p>
        <button id="registerButton" type="button">登録する</button>
      </div>
    </section>

    <section id="formPanel" class="panel calendar-shell hidden">
      <div class="toolbar">
        <label for="targetMonth">対象月
          <input id="targetMonth" type="month">
        </label>
      </div>
      <div class="weekday-row" aria-hidden="true">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <section id="days" class="month-grid" aria-label="月間カレンダー"></section>
      <p class="small">日付をタップして希望を入力します。土曜は青、日曜は赤で表示します。</p>
    </section>

    <section id="editPanel" class="edit-panel hidden" aria-live="polite">
      <div class="edit-sheet">
        <div class="edit-head">
          <div id="editTitle" class="edit-title">日付を選択</div>
          <button id="closeEditButton" class="close-button" type="button">閉じる</button>
        </div>
        <label for="editType">希望
          <select id="editType">
            <option value="none">未入力</option>
            <option value="work">出勤希望</option>
            <option value="off">休み希望</option>
          </select>
        </label>
        <div id="editTimeFields" class="hidden">
          <div class="time-row">
            <label for="editStart">開始
              <select id="editStart"></select>
            </label>
            <label for="editEnd">退勤
              <select id="editEnd"></select>
            </label>
          </div>
          <label class="up-row" for="editUp">
            <input id="editUp" type="checkbox">
            <span>UPあり</span>
          </label>
        </div>
      </div>
    </section>

    <section id="submitPanel" class="panel hidden">
      <button id="submitButton" type="button">送信する</button>
      <div id="message" class="message"></div>
    </section>

  </main>

  <div id="successModal" class="success-modal hidden" role="dialog" aria-modal="true" aria-labelledby="successTitle">
    <div class="success-box">
      <h2 id="successTitle" class="success-title">送信しました</h2>
      <p class="success-text">入力内容を保存しました。</p>
      <button id="successOkButton" class="success-button" type="button">OK</button>
    </div>
  </div>

  <script>
    const LIFF_ID = '2010088240-Yn2hGGRq';
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyYhLBYCG7jCgJJCjQ2M_fqxmfjR1W64u1My7o7gDClhElzTudUpWngYt0P4TtWLry8yQ/exec';
    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

    let idToken = '';
    let lineUserId = '';
    let lineDisplayName = '';
    let storeDisplayName = '';
    let requestSeq = 0;
    let loadRequestSeq = 0;
    let selectedDate = '';
    let isLoadingRequests = false;
    let hadEditableRequestsOnLoad = false;
    let successModalTimer = 0;
    const pendingRequests = new Map();
    const requestsByDate = new Map();

    const statusEl = document.getElementById('status');
    const authPanel = document.getElementById('authPanel');
    const registerPanel = document.getElementById('registerPanel');
    const formPanel = document.getElementById('formPanel');
    const daysEl = document.getElementById('days');
    const submitPanel = document.getElementById('submitPanel');
    const messageEl = document.getElementById('message');
    const successModal = document.getElementById('successModal');
    const monthInput = document.getElementById('targetMonth');
    const editPanel = document.getElementById('editPanel');
    const editTitle = document.getElementById('editTitle');
    const editType = document.getElementById('editType');
    const editTimeFields = document.getElementById('editTimeFields');
    const editStart = document.getElementById('editStart');
    const editEnd = document.getElementById('editEnd');
    const editUp = document.getElementById('editUp');

    document.getElementById('registerButton').addEventListener('click', registerStaff);
    document.getElementById('submitButton').addEventListener('click', submitRequests);
    document.getElementById('closeEditButton').addEventListener('click', closeEditPanel);
    document.getElementById('successOkButton').addEventListener('click', hideSuccessModal);
    monthInput.addEventListener('change', handleMonthChange);
    editType.addEventListener('change', applyEditPanelChange);
    editStart.addEventListener('change', applyEditPanelChange);
    editEnd.addEventListener('change', applyEditPanelChange);
    editUp.addEventListener('change', applyEditPanelChange);
    window.addEventListener('message', handleBackendMessage);
    fillTimeOptions(editStart, 20, 47);
    fillTimeOptions(editEnd, 22, 48);
    editStart.value = '10';
    editEnd.value = '17';

    init();

    async function init() {
      try {
        statusEl.textContent = 'LIFFを初期化しています...';
        await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
        statusEl.textContent = 'LINEログイン状態を確認しています...';
        if (!liff.isLoggedIn()) {
          statusEl.textContent = 'LINEログインへ移動します...';
          liff.login();
          return;
        }

        statusEl.textContent = 'LINEプロフィールを取得しています...';
        idToken = liff.getIDToken();
        const profile = await liff.getProfile();
        lineUserId = profile.userId || '';
        lineDisplayName = profile.displayName || '';

        if (!lineUserId) {
          throw new Error('LINEユーザーIDを取得できませんでした。');
        }

        statusEl.textContent = '登録情報を確認しています...';
        const lookup = await postBackend({ action: 'lookup' });
        if (lookup.registered) {
          storeDisplayName = lookup.storeName;
          showCalendar();
        } else {
          statusEl.textContent = `${lineDisplayName} さんの初回登録が必要です。`;
          document.getElementById('storeName').value = lineDisplayName;
          registerPanel.classList.remove('hidden');
        }
      } catch (error) {
        showFatalError(error);
      }
    }

    function showFatalError(error) {
      const message = error && error.message ? error.message : String(error);
      authPanel.classList.remove('hidden');
      statusEl.textContent = 'LINE情報の確認中に止まりました。下の詳細を確認してください。';
      messageEl.textContent = `詳細: ${message}`;
      submitPanel.classList.remove('hidden');
    }

    async function registerStaff() {
      const storeName = document.getElementById('storeName').value.trim();
      if (!storeName) {
        messageEl.textContent = '初回登録名を入力してください。';
        return;
      }

      setBusy(true, '登録中です...');
      try {
        const result = await postBackend({ action: 'register', storeName });
        storeDisplayName = result.storeName;
        registerPanel.classList.add('hidden');
        showCalendar();
      } catch (error) {
        messageEl.textContent = error.message || String(error);
      } finally {
        setBusy(false);
      }
    }

    function showCalendar() {
      statusEl.textContent = `${storeDisplayName} さんとして入力中です。`;
      authPanel.classList.add('hidden');
      formPanel.classList.remove('hidden');
      submitPanel.classList.remove('hidden');
      monthInput.value = defaultMonth();
      handleMonthChange();
    }

    async function handleMonthChange() {
      const loadRequestId = ++loadRequestSeq;
      requestsByDate.clear();
      selectedDate = '';
      hadEditableRequestsOnLoad = false;
      closeEditPanel();
      isLoadingRequests = true;
      document.getElementById('submitButton').disabled = true;
      messageEl.textContent = '保存済みデータを確認しています...';
      renderCalendar();
      try {
        await loadSavedRequests(loadRequestId);
      } finally {
        if (loadRequestId !== loadRequestSeq) return;
        isLoadingRequests = false;
        document.getElementById('submitButton').disabled = false;
        messageEl.textContent = '';
        renderCalendar();
      }
    }

    async function loadSavedRequests(loadRequestId) {
      const targetMonth = monthInput.value;
      if (!targetMonth) return;
      const range = getCalendarRange(targetMonth);

      try {
        const result = await postBackend({
          action: 'loadRequests',
          targetMonth,
          rangeStart: range.start,
          rangeEnd: range.end
        });
        if (loadRequestId !== loadRequestSeq) return;

        (result.requests || []).forEach(item => {
          const request = normalizeLoadedRequest(item);
          if (request) {
            requestsByDate.set(request.date, request);
          }
        });
        hadEditableRequestsOnLoad = Array.from(requestsByDate.values())
          .some(item => !isDateLocked(item.date));
      } catch (error) {
        if (loadRequestId !== loadRequestSeq) return;
        messageEl.textContent = error.message || String(error);
      }
    }

    function normalizeLoadedRequest(item) {
      if (!item || !item.date || !item.type) return null;
      const type = item.type;
      if (type !== 'work' && type !== 'off') return null;
      const start = type === 'work' ? String(item.start || '') : '';
      const end = type === 'work' ? String(item.end || '') : '';
      const up = type === 'work' && (item.up === true || item.up === 'true');
      return {
        date: item.date,
        weekday: item.weekday || weekdayForDate(item.date),
        type,
        start,
        end,
        up,
        displayValue: buildDisplayValue(type, start, end, up)
      };
    }

    function renderCalendar() {
      const month = monthInput.value;
      daysEl.innerHTML = '';
      if (!month) return;

      const range = getCalendarRange(month);
      const current = parseDateValue(range.start);
      const end = parseDateValue(range.end);
      while (current <= end) {
        const day = current.getDate();
        const date = new Date(current);
        const weekdayIndex = date.getDay();
        const weekday = WEEKDAYS[weekdayIndex];
        const dateValue = formatDateValue(date);
        const outsideMonth = dateValue.slice(0, 7) !== month;
        daysEl.appendChild(createCalendarDay(day, weekday, dateValue, weekdayIndex, outsideMonth));
        current.setDate(current.getDate() + 1);
      }
    }

    function createCalendarDay(day, weekday, dateValue, weekdayIndex, outsideMonth) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'calendar-day';
      button.classList.toggle('outside-month', outsideMonth);
      button.dataset.date = dateValue;
      button.dataset.weekday = weekday;
      button.dataset.day = String(day);
      button.dataset.month = String(Number(dateValue.slice(5, 7)));
      button.dataset.weekdayIndex = String(weekdayIndex);
      button.setAttribute('aria-label', `${button.dataset.month}月${day}日（${weekday}）の希望を入力`);
      if (isDateLocked(dateValue)) {
        button.disabled = true;
        button.setAttribute('aria-label', `${button.dataset.month}月${day}日（${weekday}）は締切済みです`);
      } else {
        button.addEventListener('click', () => openEditPanel(dateValue));
      }
      updateCalendarDay(button);
      return button;
    }

    function fillTimeOptions(select, fromHalf, toHalf) {
      for (let half = fromHalf; half <= toHalf; half++) {
        const option = document.createElement('option');
        const value = formatTimeValue(half);
        option.value = value;
        option.textContent = formatTimeLabel(value);
        select.appendChild(option);
      }
    }

    function openEditPanel(dateValue) {
      selectedDate = dateValue;
      const dayButton = daysEl.querySelector(`[data-date="${dateValue}"]`);
      const current = requestsByDate.get(dateValue) || {
        type: 'none',
        start: '10',
        end: '17',
        up: false
      };

      editTitle.textContent = `${dayButton.dataset.month}月${dayButton.dataset.day}日（${dayButton.dataset.weekday}）`;
      editType.value = current.type;
      editStart.value = current.start || '10';
      editEnd.value = current.end || '17';
      editUp.checked = Boolean(current.up);
      editTimeFields.classList.toggle('hidden', current.type !== 'work');
      editPanel.classList.remove('hidden');
      renderCalendar();
    }

    function closeEditPanel() {
      editPanel.classList.add('hidden');
      if (selectedDate) {
        selectedDate = '';
        renderCalendar();
      }
    }

    function applyEditPanelChange() {
      if (!selectedDate) return;

      const dayButton = daysEl.querySelector(`[data-date="${selectedDate}"]`);
      if (!dayButton) return;

      const type = editType.value;
      editTimeFields.classList.toggle('hidden', type !== 'work');
      if (type === 'none') {
        requestsByDate.delete(selectedDate);
      } else {
        const start = type === 'work' ? editStart.value : '';
        const end = type === 'work' ? editEnd.value : '';
        const up = type === 'work' && editUp.checked;
        requestsByDate.set(selectedDate, {
          date: selectedDate,
          weekday: dayButton.dataset.weekday,
          type,
          start,
          end,
          up,
          displayValue: buildDisplayValue(type, start, end, up)
        });
      }
      renderCalendar();
    }

    function updateCalendarDay(button) {
      const request = requestsByDate.get(button.dataset.date);
      const locked = isDateLocked(button.dataset.date);
      const weekdayIndex = Number(button.dataset.weekdayIndex);
      const dateClass = weekdayIndex === 0 ? 'sun' : weekdayIndex === 6 ? 'sat' : '';
      const dateLabel = button.classList.contains('outside-month')
        ? `${button.dataset.month}/${button.dataset.day}`
        : button.dataset.day;
      const valueClass = request ? valueStatusClass(request) : '';
      const valueHtml = request ? buildCalendarValueHtml(request) : '';

      button.classList.toggle('selected', button.dataset.date === selectedDate);
      button.classList.toggle('has-value', Boolean(request));
      button.classList.toggle('locked', locked);
      button.classList.toggle('invalid', Boolean(request && isInvalidRequest(request)));
      button.innerHTML = `
        <span class="date-number ${dateClass}">${dateLabel}</span>
        <span class="date-value ${valueClass} ${locked ? 'locked' : ''} ${request ? '' : 'hidden'}">${valueHtml}</span>
        <span class="date-lock ${locked ? '' : 'hidden'}">締切済</span>
      `;
    }

    function buildCalendarValueHtml(request) {
      if (request.type === 'work') {
        const timeValue = `${request.start}~${request.end}`;
        const upValue = request.up ? '<span class="date-value-up">UP</span>' : '';
        return `<span class="date-value-time">${timeValue}</span>${upValue}`;
      }
      return request.displayValue;
    }

    function valueStatusClass(request) {
      if (isInvalidRequest(request)) return 'invalid';
      if (request.type === 'work') {
        const classes = ['work'];
        const timeValue = `${request.start}~${request.end}`;
        if (request.up) classes.push('has-up');
        if (timeValue.length >= 8) classes.push('long-time');
        return classes.join(' ');
      }
      if (request.type === 'off') return 'off';
      return '';
    }

    function buildDisplayValue(type, start, end, up) {
      if (type === 'off') return '休み';
      if (type !== 'work') return '';
      if (parseTimeValue(end) <= parseTimeValue(start)) return '時間確認';
      return `${start}~${end}${up ? 'UP' : ''}`;
    }

    function isInvalidRequest(request) {
      return request.type === 'work' && parseTimeValue(request.end) <= parseTimeValue(request.start);
    }

    function parseTimeValue(value) {
      const parts = String(value || '').split(':');
      const hour = Number(parts[0]);
      const minute = parts[1] === '30' ? 30 : 0;
      return hour * 60 + minute;
    }

    function formatTimeValue(half) {
      const hour = Math.floor(half / 2);
      return half % 2 === 0 ? String(hour) : `${hour}:30`;
    }

    function formatTimeLabel(value) {
      return String(value).includes(':') ? value : `${value}:00`;
    }

    async function submitRequests() {
      if (isLoadingRequests) {
        messageEl.textContent = '保存済みデータを確認中です。少し待ってから送信してください。';
        return;
      }

      const targetMonth = monthInput.value;
      const requests = collectRequests();
      if (!targetMonth) {
        messageEl.textContent = '対象月を選択してください。';
        return;
      }
      const range = getCalendarRange(targetMonth);
      if (requests.length === 0 && !hadEditableRequestsOnLoad) {
        messageEl.textContent = '少なくとも1日分を入力してください。';
        return;
      }
      if (requests.some(isInvalidRequest)) {
        messageEl.textContent = '退勤は開始より後の時間を選んでください。';
        return;
      }

      setBusy(true, '送信中です...');
      try {
        await postBackend({
          action: 'submit',
          targetMonth,
          rangeStart: range.start,
          rangeEnd: range.end,
          requestsJson: JSON.stringify(requests)
        });
        hadEditableRequestsOnLoad = requests.length > 0;
        messageEl.textContent = '送信しました。';
        showSuccessModal();
      } catch (error) {
        messageEl.textContent = error.message || String(error);
      } finally {
        setBusy(false);
      }
    }

    function showSuccessModal() {
      clearTimeout(successModalTimer);
      successModal.classList.remove('hidden');
      successModalTimer = setTimeout(hideSuccessModal, 2500);
    }

    function hideSuccessModal() {
      clearTimeout(successModalTimer);
      successModal.classList.add('hidden');
    }

    function collectRequests() {
      return Array.from(requestsByDate.values())
        .filter(item => !isDateLocked(item.date))
        .sort((a, b) => a.date.localeCompare(b.date))
        .map(item => ({ ...item }));
    }

    function isDateLocked(dateValue) {
      const deadline = getWeekDeadline(dateValue);
      if (!deadline) return false;
      return Date.now() > deadline.getTime();
    }

    function getWeekDeadline(dateValue) {
      const parts = String(dateValue || '').split('-').map(Number);
      if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return null;
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      const daysFromMonday = (date.getDay() + 6) % 7;
      const weekStart = new Date(date);
      weekStart.setDate(date.getDate() - daysFromMonday);

      const deadline = new Date(weekStart);
      deadline.setDate(weekStart.getDate() - 3);
      deadline.setHours(12, 0, 0, 0);
      return deadline;
    }

    function weekdayForDate(dateValue) {
      const parts = String(dateValue || '').split('-').map(Number);
      if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return '';
      return WEEKDAYS[new Date(parts[0], parts[1] - 1, parts[2]).getDay()];
    }

    function postBackend(fields) {
      const requestId = createRequestId();
      return new Promise((resolve, reject) => {
        const frame = document.createElement('iframe');
        frame.name = `submitFrame_${requestId}`;
        frame.title = '送信用フレーム';
        frame.className = 'backend-frame';
        document.body.appendChild(frame);
        const pending = { resolve, reject, frame, timeoutId: 0 };
        pendingRequests.set(requestId, pending);

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = BACKEND_URL;
        form.target = frame.name;
        form.className = 'hidden';

        Object.entries({
          ...fields,
          requestId,
          lineUserId,
          lineDisplayName,
          idToken
        }).forEach(([name, value]) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value == null ? '' : String(value);
          form.appendChild(input);
        });

        const timeoutId = setTimeout(() => {
          if (pendingRequests.has(requestId)) {
            cleanupPendingRequest(requestId);
            reject(new Error('サーバー応答がタイムアウトしました。'));
          }
        }, 60000);
        pending.timeoutId = timeoutId;

        document.body.appendChild(form);
        form.submit();
        form.remove();
      });
    }

    function handleBackendMessage(event) {
      if (!event.data || event.data.source !== 'shift-liff-form') return;
      if (!isTrustedBackendOrigin(event.origin)) return;
      const pending = pendingRequests.get(event.data.requestId);
      if (!pending) return;
      cleanupPendingRequest(event.data.requestId);
      if (event.data.ok) {
        pending.resolve(event.data);
      } else {
        pending.reject(new Error(event.data.error || '送信に失敗しました。'));
      }
    }

    function createRequestId() {
      const randomPart = window.crypto && typeof window.crypto.randomUUID === 'function'
        ? window.crypto.randomUUID()
        : `${Math.random().toString(36).slice(2)}${Math.random().toString(36).slice(2)}`;
      return `req_${Date.now()}_${++requestSeq}_${randomPart}`;
    }

    function isTrustedBackendOrigin(origin) {
      try {
        const url = new URL(origin);
        return url.protocol === 'https:' && (
          url.hostname === 'script.google.com' ||
          url.hostname.endsWith('-script.googleusercontent.com')
        );
      } catch (_error) {
        return false;
      }
    }

    function cleanupPendingRequest(requestId) {
      const pending = pendingRequests.get(requestId);
      if (!pending) return;
      clearTimeout(pending.timeoutId);
      pending.frame.remove();
      pendingRequests.delete(requestId);
    }

    function setBusy(isBusy, text) {
      document.getElementById('registerButton').disabled = isBusy;
      document.getElementById('submitButton').disabled = isBusy;
      if (text) messageEl.textContent = text;
    }

    function defaultMonth() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function getCalendarRange(month) {
      const [year, monthNumber] = String(month || '').split('-').map(Number);
      const first = new Date(year, monthNumber - 1, 1);
      const last = new Date(year, monthNumber, 0);
      const start = new Date(first);
      const end = new Date(last);
      start.setDate(first.getDate() - first.getDay());
      end.setDate(last.getDate() + (6 - last.getDay()));
      return {
        start: formatDateValue(start),
        end: formatDateValue(end)
      };
    }

    function parseDateValue(value) {
      const parts = String(value || '').split('-').map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function formatDateValue(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
  </script>
</body>
